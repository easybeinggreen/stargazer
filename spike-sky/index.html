<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Stargazer · Phase 3 sky</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05060a;
    font: 13px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #e6ecf5; }
  #view { position: fixed; inset: 0; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 0; }
  canvas { position: fixed; inset: 0; z-index: 1; touch-action: none; }
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; transform: translate(-50%, -50%);
    font-size: 11px; text-shadow: 0 0 3px #000, 0 0 6px #000; will-change: transform; }
  .lbl.star { color: #cfe0ff; }
  .lbl.planet { color: #ffe0a3; font-weight: 600; }
  .lbl.moon { color: #fff; font-weight: 600; }
  .lbl.sun { color: #ffd27a; font-weight: 700; }
  .lbl.sunev { color: #ffce85; font-weight: 600; font-size: 10px; }
  .lbl.card { color: #7fd8b0; font-weight: 700; font-size: 13px; letter-spacing: .05em; }
  .lbl .dot { opacity: .5; }

  #panel { position: fixed; z-index: 4; left: 8px; right: 8px; top: 8px;
    background: rgba(12,17,26,.92); backdrop-filter: blur(6px);
    border: 1px solid #1f2a3d; border-radius: 12px; padding: 8px 10px;
    max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; }
  #panel.hidden { display: none; }
  #panel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; }
  #panel .row + .row { margin-top: 6px; }
  button, input, select { font: inherit; border-radius: 8px; border: 1px solid #29344a;
    background: #141b2a; color: #e6ecf5; padding: 7px 9px; }
  button { font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button.go { background: #6fe3b0; color: #051; border: 0; }
  button.on { background: #2f5fce; border-color: #2f5fce; color: #fff; }
  input[type=number] { width: 92px; }
  input[type=datetime-local] { width: 190px; }
  input[type=range] { width: 130px; padding: 0; }
  label.chk { font-size: 12px; color: #9fb2d0; display: inline-flex; align-items: center; gap: 4px; }
  #hud { position: fixed; z-index: 4; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
    font: 11px/1.4 ui-monospace, Consolas, monospace; color: #8fb0d8; text-shadow: 0 0 4px #000;
    pointer-events: none; }
  #err { position: fixed; z-index: 5; left: 8px; right: 8px; bottom: 8px; color: #ff9a9a;
    font-size: 12px; text-shadow: 0 0 4px #000; }
  #toggleP { position: fixed; z-index: 6; right: 10px; top: calc(10px + env(safe-area-inset-top));
    width: 40px; height: 40px; border-radius: 50%; padding: 0; font-size: 18px; line-height: 40px;
    background: rgba(12,17,26,.82); border: 1px solid #29344a; }
  #toggleP.on { background: #2f5fce; border-color: #2f5fce; }
  #capBtn { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%;
    background: #6fe3b0; color: #04231a; font-size: 25px; line-height: 62px; padding: 0;
    border: 3px solid rgba(255,255,255,.28); box-shadow: 0 3px 14px rgba(0,0,0,.4); }
  #capBtn:active { filter: brightness(.9); }
  #lockBtn { position: fixed; z-index: 5; right: 14px; bottom: calc(30px + env(safe-area-inset-bottom));
    padding: 9px 13px; border-radius: 20px; font-size: 13px;
    background: rgba(12,17,26,.82); border: 1px solid #29344a; }
  #lockBtn.on { background: #2f5fce; border-color: #2f5fce; }
  #shot { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px;
    background: rgba(4,6,10,.92); backdrop-filter: blur(4px); }
  #shot img { max-width: 94vw; max-height: 74vh; border-radius: 10px; border: 1px solid #29344a; }
  #shot .btns { display: flex; gap: 10px; }
  #shot button { padding: 11px 18px; border-radius: 10px; }
  #shot .prim { background: #6fe3b0; color: #051; border: 0; }
  #shot .hint { font-size: 12px; color: #8a99b4; }
  a { color: #6fe3b0; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.min.js"
} }
</script>
</head>
<body>
  <video id="cam" playsinline muted></video>
  <div id="labels"></div>
  <button id="toggleP" title="settings">⚙</button>

  <div id="panel">
    <div class="row">
      <button class="go" id="loc">Use location</button>
      <input id="lat" type="number" step="0.0001" placeholder="lat" />
      <input id="lon" type="number" step="0.0001" placeholder="lon" />
      <button id="closeP" title="close">✕</button>
    </div>
    <div class="row extra">
      <label class="chk"><input type="checkbox" id="freeze" /> freeze</label>
      <input id="dt" type="datetime-local" step="1" />
      <button id="now">now</button>
    </div>
    <div class="row extra">
      <button id="mode">view: manual ⇄</button>
      <button id="camBtn">camera: off</button>
      <button id="fsBtn">fullscreen ⤢</button>
      <label class="chk"><input type="checkbox" id="lines" checked /> constellations</label>
      <label class="chk"><input type="checkbox" id="labs" checked /> labels</label>
      <label class="chk"><input type="checkbox" id="sunpath" checked /> sun path</label>
    </div>
    <div class="row extra">
      <span style="font-size:11px;color:#6b7a94">FOV</span>
      <input id="fov" type="range" min="25" max="100" value="65" />
      <span style="font-size:11px;color:#6b7a94">stars</span>
      <input id="gain" type="range" min="15" max="320" value="100" />
    </div>
    <div class="row extra">
      <span style="font-size:11px;color:#6b7a94">heading nudge</span>
      <input id="nudge" type="range" min="-180" max="180" value="0" />
      <button id="nudge0" title="reset alignment">⟲ reset</button>
      <span id="nudgeVal" style="font-size:11px;color:#6b7a94">0°</span>
    </div>
  </div>

  <div id="hud">—</div>
  <div id="err"></div>
  <button id="capBtn" title="capture">◉</button>
  <button id="lockBtn" title="lock onto the Moon or a bright planet in the camera view">🌙 lock</button>

  <div id="shot">
    <img id="shotImg" alt="captured sky" />
    <div class="btns">
      <button class="prim" id="shotShare">Share</button>
      <button id="shotSave">Save</button>
      <button id="shotClose">Close</button>
    </div>
    <div class="hint" id="shotHint">long-press the image to save it too</div>
  </div>

<script src="./vendor/astronomy.browser.js"></script>
<script type="module">
import * as THREE from 'three';

const A = window.Astronomy;
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, RAD = 180 / Math.PI;
const R = 100;                       // celestial sphere radius (world units)
const REF_OBS = new A.Observer(0, 0, 0);   // for star of-date conversion (parallax = 0 for stars)
const errEl = $('err');
const showErr = m => { errEl.textContent = m || ''; if (m) console.error(m); };

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 4000);
camera.rotation.order = 'YXZ';

// ---------- state ----------
const state = {
  lat: null, lon: null, elev: 40,
  ofDate: null,          // Date the of-date star coords were computed for
  useDevice: false, camOn: false, frozen: false,
  yaw: Math.PI, pitch: 18 * DEG,   // start facing ~North, tilted up
  nudge: 0,
  showLines: true, showLabels: true, showSunPath: true,
  sunEv: {},
};

// ---------- coordinate transform ----------
// equatorial (RA deg of-date, Dec rad) + local sidereal time -> unit vector (E,up,N=-z)
function eqToVec(raDeg, sinDec, cosDec, lstDeg, sinLat, cosLat, out) {
  const H = (lstDeg - raDeg) * DEG;
  const sinH = Math.sin(H), cosH = Math.cos(H);
  const sinAlt = sinDec * sinLat + cosDec * cosLat * cosH;
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  const az = Math.atan2(-cosDec * sinH, sinDec * cosLat - cosDec * sinLat * cosH); // from N, +E
  const ca = Math.cos(alt);
  out.set(R * ca * Math.sin(az), R * Math.sin(alt), -R * ca * Math.cos(az));
  return alt;
}
function altAzToVec(altDeg, azDeg, out) {
  const alt = altDeg * DEG, az = azDeg * DEG, ca = Math.cos(alt);
  out.set(R * ca * Math.sin(az), R * Math.sin(alt), -R * ca * Math.cos(az));
}
function lstDegrees(date) { return (A.SiderealTime(date) * 15 + state.lon) % 360; }

// ---------- star field ----------
let starGeo, starMat, starPoints;
let STAR = [];          // {raDeg, sinDec, cosDec, size, name, mag}
const bvColor = (bv) => {
  bv = (bv == null) ? 0.65 : Math.max(-0.35, Math.min(1.9, bv));
  // crude but readable temperature ramp
  if (bv < 0.0)  return [0.70, 0.80, 1.00];
  if (bv < 0.30) return [0.86, 0.91, 1.00];
  if (bv < 0.60) return [1.00, 1.00, 0.96];
  if (bv < 1.00) return [1.00, 0.95, 0.82];
  if (bv < 1.40) return [1.00, 0.86, 0.68];
  return [1.00, 0.78, 0.60];
};

async function buildStars() {
  const raw = await (await fetch('./stars.json')).json();
  const now = new Date();
  const n = raw.length;
  const positions = new Float32Array(n * 3);
  const colors = new Float32Array(n * 3);
  const sizes = new Float32Array(n);
  const brights = new Float32Array(n);
  STAR = new Array(n);
  const dpr = Math.min(devicePixelRatio, 2);
  for (let i = 0; i < n; i++) {
    const s = raw[i];
    // of-date RA/Dec (bakes in precession/nutation/aberration) — once, at load
    A.DefineStar(A.Body.Star1, s.r, s.d, 1000);
    const eq = A.Equator(A.Body.Star1, now, REF_OBS, true, true);
    const decR = eq.dec * DEG;
    const [r, g, b] = bvColor(s.ci);
    // perceptual size: wider dynamic range than linear, capped
    const flux = Math.pow(2.512, 0.4 * (6.5 - s.m));
    const size = Math.max(0.8, Math.min(24, 1.15 * Math.sqrt(flux) + 0.5)) * dpr;
    // faint stars also dimmer, not just smaller
    const bright = Math.max(0.05, Math.min(1, (6.9 - s.m) / 7.2));
    STAR[i] = { raDeg: eq.ra * 15, sinDec: Math.sin(decR), cosDec: Math.cos(decR), size, name: s.n, mag: s.m, con: s.c, bayer: s.b };
    colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
    sizes[i] = size;
    brights[i] = bright;
  }
  starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  starGeo.setAttribute('bright', new THREE.BufferAttribute(brights, 1));
  starMat = new THREE.ShaderMaterial({
    uniforms: { uOpacity: { value: 1 }, uGain: { value: 1 } },
    vertexShader: `
      attribute float size; attribute vec3 color; attribute float bright;
      varying vec3 vColor; varying float vBright;
      void main(){ vColor = color; vBright = bright;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size; }`,
    fragmentShader: `
      precision mediump float; varying vec3 vColor; varying float vBright;
      uniform float uOpacity; uniform float uGain;
      void main(){ float r = length(gl_PointCoord - vec2(0.5)) * 2.0;
        float a = smoothstep(1.0, 0.12, r); if (a <= 0.01) discard;
        gl_FragColor = vec4(vColor, a * uOpacity * vBright * uGain); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  starPoints = new THREE.Points(starGeo, starMat);
  starPoints.frustumCulled = false;
  scene.add(starPoints);
  state.ofDate = now;
}

// ---------- constellation lines ----------
let conSeg, CON = [];   // flat list of {raDeg, sinDec, cosDec}
async function buildLines() {
  const gj = await (await fetch('./constellations.lines.json')).json();
  const now = new Date();
  const verts = [];      // pairs of indices into CON
  for (const f of gj.features) {
    for (const line of f.geometry.coordinates) {
      for (let k = 0; k < line.length; k++) {
        let [lon, lat] = line[k];
        const raH = ((lon < 0 ? lon + 360 : lon)) / 15;
        A.DefineStar(A.Body.Star1, raH, lat, 1000);
        const eq = A.Equator(A.Body.Star1, now, REF_OBS, true, true);
        const decR = eq.dec * DEG;
        CON.push({ raDeg: eq.ra * 15, sinDec: Math.sin(decR), cosDec: Math.cos(decR) });
        if (k > 0) { verts.push(CON.length - 2, CON.length - 1); }
      }
    }
  }
  const pos = new Float32Array(CON.length * 3);   // will hold per-vertex positions; use index buffer
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(verts);
  const mat = new THREE.LineBasicMaterial({ color: 0x3b6ea5, transparent: true, opacity: 0.34 });
  conSeg = new THREE.LineSegments(geo, mat);
  conSeg.frustumCulled = false;
  scene.add(conSeg);
}

// ---------- solar-system bodies ----------
const BODIES = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
const bodyMarks = {};
function buildHorizon() {
  const pts = [];
  for (let a = 0; a <= 360; a += 2) { const v = new THREE.Vector3(); altAzToVec(0, a, v); pts.push(v); }
  const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x6a8aa8, transparent: true, opacity: 0.55 }));
  ring.frustumCulled = false; scene.add(ring);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R * 0.99, 72),
    new THREE.MeshBasicMaterial({ color: 0x090d13, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2; disc.position.y = -0.6; disc.renderOrder = -1;
  scene.add(disc);
}

function glowTexture(inner, mid) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, inner); rg.addColorStop(0.28, mid); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function buildBodies() {
  const sunTex = glowTexture('rgba(255,246,220,1)', 'rgba(255,210,120,0.85)');
  for (const b of BODIES) {
    const isSun = b === 'Sun', isMoon = b === 'Moon';
    const mat = isSun
      ? new THREE.SpriteMaterial({ map: sunTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
      : new THREE.SpriteMaterial({ color: isMoon ? 0xffffff : 0xffe0a3, transparent: true, opacity: 0.95, depthWrite: false });
    const spr = new THREE.Sprite(mat);
    const sz = isSun ? 9 : isMoon ? 3.4 : 1.6;
    spr.scale.set(sz, sz, 1);
    scene.add(spr);
    bodyMarks[b] = spr;
  }
}

// ---------- HTML labels ----------
const labelLayer = $('labels');
const labels = [];   // {el, get: ()=>Vector3|null, cls, name}
function mkLabel(text, cls, get) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.innerHTML = (cls === 'card' ? '' : '<span class="dot">•</span> ') + text;
  labelLayer.appendChild(el);
  labels.push({ el, get, cls, name: text });
}
function buildLabels() {
  for (const [name, az] of [['N',0],['E',90],['S',180],['W',270],['NE',45],['SE',135],['SW',225],['NW',315]]) {
    mkLabel(name, 'card', () => { const v = new THREE.Vector3(); altAzToVec(2.5, az, v); return v; });
  }
  for (const b of BODIES) mkLabel(b, b === 'Sun' ? 'sun' : b === 'Moon' ? 'moon' : 'planet',
    () => bodyMarks[b].visible ? bodyMarks[b].position : null);
  // sun path events (text updates each recompute)
  for (const k of ['rise', 'noon', 'set'])
    mkLabel('', 'sunev', () => (state.showSunPath && state.sunEv[k]) ? state.sunEv[k] : null);
  // bright named stars
  const tmp = STAR.map((s, i) => ({ s, i })).filter(o => o.s.name && o.s.mag < 2.6)
    .sort((a, b) => a.s.mag - b.s.mag).slice(0, 90);
  for (const { i } of tmp) mkLabel(STAR[i].name, 'star', () => starVec(i));
}
const _sv = new THREE.Vector3();
let _lst = 0, _sinLat = 0, _cosLat = 1;
function starVec(i) {
  const s = STAR[i];
  const alt = eqToVec(s.raDeg, s.sinDec, s.cosDec, _lst, _sinLat, _cosLat, _sv);
  return alt > -1 ? _sv : null;
}

// ---------- recompute positions for a given time ----------
function recompute(date) {
  if (state.lat == null) return;
  // refresh of-date coords if the date drifted a lot (months) from when we precessed
  if (state.ofDate && Math.abs(date - state.ofDate) > 40 * 864e5) reprecess(date);

  _lst = lstDegrees(date);
  _sinLat = Math.sin(state.lat * DEG); _cosLat = Math.cos(state.lat * DEG);

  // stars — below-horizon points parked out of the frustum
  const pos = starGeo.attributes.position.array;
  const v = new THREE.Vector3();
  for (let i = 0; i < STAR.length; i++) {
    const s = STAR[i];
    const alt = eqToVec(s.raDeg, s.sinDec, s.cosDec, _lst, _sinLat, _cosLat, v);
    if (alt < -1.5) { pos[i*3] = 0; pos[i*3+1] = -99999; pos[i*3+2] = 0; }
    else { pos[i*3] = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z; }
  }
  starGeo.attributes.position.needsUpdate = true;

  // constellation lines
  if (conSeg) {
    const cp = conSeg.geometry.attributes.position.array;
    for (let i = 0; i < CON.length; i++) {
      const c = CON[i];
      eqToVec(c.raDeg, c.sinDec, c.cosDec, _lst, _sinLat, _cosLat, v);
      cp[i*3] = v.x; cp[i*3+1] = v.y; cp[i*3+2] = v.z;
    }
    conSeg.geometry.attributes.position.needsUpdate = true;
  }

  // bodies (accurate)
  const obs = new A.Observer(state.lat, state.lon, state.elev);
  let sunAlt = -90;
  for (const b of BODIES) {
    try {
      const eq = A.Equator(A.Body[b], date, obs, true, true);
      const h = A.Horizon(date, obs, eq.ra, eq.dec, 'normal');
      altAzToVec(h.altitude, h.azimuth, bodyMarks[b].position);
      bodyMarks[b].visible = h.altitude > -2;
      if (b === 'Sun') sunAlt = h.altitude;
      bodyMarks[b]._alt = h.altitude; bodyMarks[b]._az = h.azimuth;
    } catch (e) { bodyMarks[b].visible = false; }
  }
  applySky(sunAlt);
  updateSunPath(date);
  state.lastDate = date;
}

function reprecess(date) {
  // Of-date star coords are computed once at load. Precession drift over a session (even months)
  // is < ~0.05°, well below the magnetometer error that dominates AR. Just move the marker.
  state.ofDate = date;
}

// ---------- sun path: today's arc + seasonal extremes + rise/noon/set ----------
let sunPathGrp = null, sunPathKey = '';
function sunArc(obs, dayDate, color, opacity) {
  const base = new Date(dayDate); base.setHours(0, 0, 0, 0);
  const segs = []; let cur = [];
  for (let m = 0; m <= 1440; m += 6) {
    const t = new Date(base.getTime() + m * 60000);
    const eq = A.Equator(A.Body.Sun, t, obs, true, true);
    const h = A.Horizon(t, obs, eq.ra, eq.dec, 'normal');
    if (h.altitude > -1) { const v = new THREE.Vector3(); altAzToVec(h.altitude, h.azimuth, v); cur.push(v); }
    else if (cur.length) { segs.push(cur); cur = []; }
  }
  if (cur.length) segs.push(cur);
  const grp = new THREE.Group();
  for (const seg of segs) {
    if (seg.length < 2) continue;
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(seg),
      new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
    l.frustumCulled = false; grp.add(l);
  }
  return grp;
}
function updateSunPath(date) {
  const key = date.toISOString().slice(0, 10) + '|' + state.lat.toFixed(3) + '|' + state.lon.toFixed(3);
  if (key === sunPathKey) return;
  sunPathKey = key;
  if (sunPathGrp) { scene.remove(sunPathGrp); sunPathGrp.traverse(o => o.geometry && o.geometry.dispose()); }
  sunPathGrp = new THREE.Group();
  const obs = new A.Observer(state.lat, state.lon, state.elev);
  const yr = date.getFullYear();
  sunPathGrp.add(sunArc(obs, new Date(yr, 5, 21), 0xffb27a, 0.20));   // Jun solstice
  sunPathGrp.add(sunArc(obs, new Date(yr, 11, 21), 0x8fb4dc, 0.20));  // Dec solstice
  sunPathGrp.add(sunArc(obs, date, 0xffd27a, 0.85));                  // today

  // hour ticks on today's path
  const base = new Date(date); base.setHours(0, 0, 0, 0);
  const tp = [];
  for (let hr = 0; hr < 24; hr++) {
    const t = new Date(base.getTime() + hr * 3600000);
    const eq = A.Equator(A.Body.Sun, t, obs, true, true);
    const h = A.Horizon(t, obs, eq.ra, eq.dec, 'normal');
    if (h.altitude > 0) { const v = new THREE.Vector3(); altAzToVec(h.altitude, h.azimuth, v); tp.push(v.x, v.y, v.z); }
  }
  if (tp.length) {
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));

  const atSun = (d, lo) => { const eq = A.Equator(A.Body.Sun, d, obs, true, true); const h = A.Horizon(d, obs, eq.ra, eq.dec, 'normal'); const v = new THREE.Vector3(); altAzToVec(Math.max(h.altitude, lo), h.azimuth, v); return { v, alt: h.altitude }; };

    const set = A.SearchRiseSet(A.Body.Sun, obs, -1, base, 2);
    const noon = A.SearchHourAngle(A.Body.Sun, obs, 0, base, +1);
    if (rise) state.sunEv.rise = { pos: atSun(rise.date, 0.6).v, text: '☀ rise ' + fmt(rise.date) };
    if (set)  state.sunEv.set  = { pos: atSun(set.date, 0.6).v,  text: '☀ set ' + fmt(set.date) };
    if (noon) { const n = atSun(noon.time.date, 0.6); state.sunEv.noon = { pos: n.v, text: 'noon ' + fmt(noon.time.date) + ' · ' + n.alt.toFixed(0) + '°' }; }

}

// ---------- sky colour ----------
const cNight = new THREE.Color(0x05060a), cAstro = new THREE.Color(0x070c16),
      cNaut = new THREE.Color(0x0d1a2b), cCivil = new THREE.Color(0x24405f), cDay = new THREE.Color(0x6f9fd8);

  else if (sunAlt > -6) col = lerpC(cCivil, cDay, (sunAlt + 6) / 6).clone();
  else if (sunAlt > -12) col = lerpC(cNaut, cCivil, (sunAlt + 12) / 6).clone();
  else if (sunAlt > -18) col = lerpC(cAstro, cNaut, (sunAlt + 18) / 6).clone();
  else col = cNight;
  if (!state.camOn) renderer.setClearColor(col, 1); else renderer.setClearColor(0x000000, 0);
  const starVis = Math.max(0, Math.min(1, (-sunAlt - 4) / 9));

  const g = starMat.uniforms.uGain.value;
  const dayFloor = Math.max(0, Math.min(0.5, (g - 1.3) / 3.6));
  starMat.uniforms.uOpacity.value = state.camOn ? Math.max(starVis, 0.85) : Math.max(starVis, dayFloor);

// ---------- device orientation ----------
const _zee = new THREE.Vector3(0, 0, 1);
const _euler = new THREE.Euler();
const _q0 = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
let devOri = null, haveAbsolute = false;
const _upY = new THREE.Vector3(0, 1, 0);
const _targetQ = new THREE.Quaternion();
const corrQ = new THREE.Quaternion();   // accumulated tap-to-align correction (both axes)
// Android fires BOTH events with different alpha zero-points — lock onto the
// Earth-frame (absolute) one and ignore the relative one once it appears.
function onDevOriAbs(e) { if (e.alpha != null) { haveAbsolute = true; devOri = e; } }

  const orient = ((screen.orientation && screen.orientation.angle) || 0) * DEG;
  _euler.set(beta, alpha, -gamma, 'YXZ');
  _targetQ.setFromEuler(_euler);
  _targetQ.multiply(_q1);
  _targetQ.multiply(_q0.setFromAxisAngle(_zee, -orient));
  _targetQ.premultiply(_q0.setFromAxisAngle(_upY, state.nudge * DEG));   // manual heading nudge
  _targetQ.premultiply(corrQ);                                          // tap-to-align (az + alt)
  camera.quaternion.slerp(_targetQ, 0.22);                              // low-pass: kills sensor dither
}

// ---------- drag look ----------
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (state.useDevice) return; dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = (camera.fov / 65) * 0.0022;
  state.yaw   -= (e.clientX - lastX) * k;
  state.pitch += (e.clientY - lastY) * k;
  state.pitch = Math.max(-85 * DEG, Math.min(85 * DEG, state.pitch));
  lastX = e.clientX; lastY = e.clientY;

// pinch / wheel zoom

let pinchD = 0;
renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinchD) setFov(camera.fov * (pinchD / d));

}, { passive: true });

// ---------- tap to align (auto mode): tap the real bright object -> correct heading ----------
const _rc = new THREE.Raycaster();
const _v2 = new THREE.Vector2();
let tapDown = null;
renderer.domElement.addEventListener('pointerdown', e => { tapDown = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  const d = tapDown; tapDown = null;
  if (!d || !state.useDevice) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 14 || performance.now() - d.t > 450) return; // was a drag
  alignToTap(e.clientX, e.clientY);
});
let toastT = 0;
function toast(m) { showErr(m); clearTimeout(toastT); toastT = setTimeout(() => showErr(''), 2600); }
function alignToTap(px, py) {
  _v2.set((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1);
  _rc.setFromCamera(_v2, camera);
  const tapDir = _rc.ray.direction;
  const cands = [];
  for (const b of BODIES) if (bodyMarks[b].visible) cands.push({ name: b, dir: bodyMarks[b].position.clone().normalize(), w: 1 });
  for (const L of labels) { if (L.cls !== 'star') continue; const wp = L.get(); if (wp) cands.push({ name: L.name, dir: wp.clone().normalize(), w: 1.4 }); }
  let best = null, bestScore = 1e9;
  for (const c of cands) { const s = c.dir.angleTo(tapDir) * c.w; if (s < bestScore) { bestScore = s; best = c; } }
  const sep = best.dir.angleTo(tapDir);

  const rq = new THREE.Quaternion().setFromUnitVectors(tapDir.clone().normalize(), best.dir.clone().normalize());
  corrQ.premultiply(rq);

// ---------- camera-image lock: find the Moon / a bright planet in the video and snap to it ----------
const _scan = document.createElement('canvas');
const _pl = new THREE.Vector3();
function lockToImage() {
  if (!state.camOn) { toast('turn the camera on first (camera: on)'); return; }
  if (!state.useDevice) { toast('switch to view: auto first'); return; }
  const vid = $('cam');
  if (!vid.videoWidth) { toast('camera not ready yet'); return; }

  // choose the brightest predicted body that is up and inside the frame
  let target = null;
  for (const name of ['Moon', 'Venus', 'Jupiter', 'Mars', 'Saturn']) {
    const m = bodyMarks[name];
    if (!m || !m.visible) continue;
    _pl.copy(m.position).project(camera);
    if (_pl.z < 1 && Math.abs(_pl.x) < 0.92 && Math.abs(_pl.y) < 0.92) {
      target = { name, dir: m.position.clone().normalize(), ndc: _pl.clone() };
      break;
    }
  }
  if (!target) { toast('point roughly at the Moon or a bright planet first'); return; }

  // draw the frame into a small canvas at screen aspect + cover crop (px map linearly to screen)
  const SW = 320, SH = Math.max(2, Math.round(320 * innerHeight / innerWidth));
  _scan.width = SW; _scan.height = SH;
  const sc = _scan.getContext('2d', { willReadFrequently: true });
  const vw = vid.videoWidth, vh = vid.videoHeight, s = Math.max(SW / vw, SH / vh);
  sc.drawImage(vid, (SW - vw * s) / 2, (SH - vh * s) / 2, vw * s, vh * s);
  const px = sc.getImageData(0, 0, SW, SH).data;
  const lum = i => px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;

  // brightest pixel within a search box around the predicted position
  const cx = (target.ndc.x * 0.5 + 0.5) * SW, cy = (-target.ndc.y * 0.5 + 0.5) * SH;
  const rad = Math.round(SW * 0.17);
  let maxL = -1, mx = cx, my = cy;
  for (let y = Math.max(0, cy - rad | 0); y < Math.min(SH, cy + rad); y++)
    for (let x = Math.max(0, cx - rad | 0); x < Math.min(SW, cx + rad); x++) {
      const L = lum((y * SW + x) * 4);
      if (L > maxL) { maxL = L; mx = x; my = y; }
    }

    for (let x = Math.max(0, mx - br); x < Math.min(SW, mx + br); x++) {
      const L = lum((y * SW + x) * 4);

    }

// ---------- capture ----------
let shotBlob = null, shotUrl = null;
function captureShot() {
  try {
    if (innerHeight > innerWidth && !document.fullscreenElement) {
      toast('tip: tap fullscreen ⤢ for a landscape shot');
    }
    const gl = renderer.domElement;
    const W = gl.width, H = gl.height;
    const dpr = renderer.getPixelRatio();
    const cvs = document.createElement('canvas');
    cvs.width = W; cvs.height = H;
    const ctx = cvs.getContext('2d');

    // base layer: camera feed (object-fit: cover) or the sky colour
    const vid = $('cam');
    if (state.camOn && vid.videoWidth) {
      const vw = vid.videoWidth, vh = vid.videoHeight;
      const s = Math.max(W / vw, H / vh);
      ctx.drawImage(vid, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
    } else {
      ctx.fillStyle = '#' + renderer.getClearColor(new THREE.Color()).getHexString();
      ctx.fillRect(0, 0, W, H);
    }

    // sky layer: force a fresh render, then copy the WebGL buffer
    renderer.render(scene, camera);
    ctx.drawImage(gl, 0, 0, W, H);

    // label layer
    ctx.textBaseline = 'middle';
    const colFor = c => c === 'card' ? '#7fd8b0' : c === 'planet' ? '#ffe0a3'
      : c === 'moon' ? '#ffffff' : c === 'sun' || c === 'sunev' ? '#ffd27a' : '#cfe0ff';
    for (const L of labels) {
      const r = L.get(); if (!r) continue;
      const wp = r.isVector3 ? r : r.pos;
      const txt = r.isVector3 ? L.name : (r.text || '');
      if (!txt) continue;
      _p.copy(wp).project(camera);
      if (_p.z > 1 || Math.abs(_p.x) > 1 || Math.abs(_p.y) > 1) continue;
      const x = (_p.x * 0.5 + 0.5) * W, y = (-_p.y * 0.5 + 0.5) * H;
      ctx.font = `600 ${(L.cls === 'card' ? 13 : 11) * dpr}px system-ui, -apple-system, sans-serif`;
      const tx = x + (L.cls === 'card' ? 0 : 7 * dpr);
      ctx.textAlign = L.cls === 'card' ? 'center' : 'left';
      ctx.lineWidth = 3 * dpr; ctx.strokeStyle = 'rgba(0,0,0,.85)';
      ctx.strokeText(txt, tx, y);
      ctx.fillStyle = colFor(L.cls);
      ctx.fillText(txt, tx, y);
    }
    ctx.textAlign = 'left';

    // caption strip
    const bh = Math.max(40 * dpr, H * 0.055);
    ctx.fillStyle = 'rgba(5,7,12,.6)';
    ctx.fillRect(0, H - bh, W, bh);
    const d = state.lastDate || new Date();
    const when = d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    ctx.fillStyle = '#e6ecf5';
    ctx.font = `${12.5 * dpr}px system-ui, -apple-system, sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillText(`${when}  ·  ${state.lat.toFixed(3)}, ${state.lon.toFixed(3)}`, 12 * dpr, H - bh / 2);
    ctx.textAlign = 'right'; ctx.fillStyle = '#6fe3b0';
    ctx.fillText('✦ Stargazer', W - 12 * dpr, H - bh / 2);
    ctx.textAlign = 'left';

    cvs.toBlob(b => {
      if (!b) { showErr('capture failed'); return; }
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotBlob = b; shotUrl = URL.createObjectURL(b);
      $('shotImg').src = shotUrl;
      $('shot').style.display = 'flex';
    }, 'image/png');
  } catch (e) { showErr('capture: ' + e.message); }
}

    await buildStars();
    await buildLines();
    buildLabels();
    setDtNow();
    // seed a location so there's something on screen before geolocation
    setLoc(-27.4835, 153.0019, 40);
    $('loc').textContent = 'Use location';
    frame();
    // auto-try geolocation
    navigator.geolocation.getCurrentPosition(
      p => setLoc(p.coords.latitude, p.coords.longitude, p.coords.altitude || 40),
      () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  } catch (e) { showErr('boot: ' + ((e && (e.stack || e.message)) || String(e))); }
})();
</script>
</body>
</html>
